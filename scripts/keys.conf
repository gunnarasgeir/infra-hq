# Keys this setup uses. Names only, NEVER values.
# The agent adds a line per key during onboarding; scripts/set-key.* and scripts/load-keys.sh read this file.
#
# Format (whitespace separated, one key per line):
#   ENV_VARIABLE   Label   [verify URL]
#
# The optional verify URL is called with "Authorization: Bearer <key>"; any 2xx answer means the key works.
#
# Examples:
#   CLOUDFLARE_API_TOKEN   Cloudflare   https://api.cloudflare.com/client/v4/user/tokens/verify
#   HCLOUD_TOKEN           Hetzner      https://api.hetzner.cloud/v1/servers
#   VERCEL_TOKEN           Vercel       https://api.vercel.com/v2/user
#   DIGITALOCEAN_TOKEN     DigitalOcean https://api.digitalocean.com/v2/account
